<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Registration Form</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           Modern Design Tokens & Variables
           ========================================================= */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-ring: rgba(37, 99, 235, 0.2);
            --secondary: #64748b;
            --bg-page: #0f172a;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --border-focus: #2563eb;
            --input-bg: #f8fafc;
            --card-radius: 20px;
            --element-radius: 10px;
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================================
           Reset & Base Styles
           ========================================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e1b4b 100%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           Form Card Container
           ========================================================= */
        .container {
            width: 100%;
            max-width: 740px;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           Header Banner
           ========================================================= */
        .form-header {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 60%, #3b82f6 100%);
            color: #ffffff;
            padding: 2.75rem 2.25rem 2.25rem;
            text-align: center;
            position: relative;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(8px);
            padding: 0.35rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .form-header p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 480px;
            margin: 0 auto;
        }

        /* =========================================================
           Form Layout & Sections
           ========================================================= */
        form {
            padding: 2.25rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding-bottom: 0.65rem;
            border-bottom: 2px solid var(--border-color);
        }

        .section-header svg {
            color: var(--primary);
            flex-shrink: 0;
        }

        .section-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        /* =========================================================
           Input Grids & Form Groups
           ========================================================= */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        @media (max-width: 640px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            form {
                padding: 1.5rem;
            }
            .form-header {
                padding: 2rem 1.5rem 1.75rem;
            }
            .form-header h1 {
                font-size: 1.6rem;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-group > label,
        .group-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            display: block;
        }

        /* =========================================================
           Inputs, Selects, & Textarea Controls
           ========================================================= */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--element-radius);
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:hover,
        input[type="email"]:hover,
        input[type="tel"]:hover,
        input[type="password"]:hover,
        input[type="date"]:hover,
        select:hover {
            border-color: var(--border-hover);
            background-color: #ffffff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--border-focus);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-ring);
        }

        input::placeholder {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* Custom Dropdown Styling */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-60%) rotate(45deg);
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--secondary);
            border-bottom: 2px solid var(--secondary);
            pointer-events: none;
        }

        /* =========================================================
           Radio & Checkbox Button Chips
           ========================================================= */
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .chip-label {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 1.1rem;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--element-radius);
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .chip-label:hover {
            background: #ffffff;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .chip-label input[type="radio"],
        .chip-label input[type="checkbox"] {
            accent-color: var(--primary);
            width: 1.1rem;
            height: 1.1rem;
            margin: 0;
            cursor: pointer;
        }

        /* Modern interactive selection highlighting using :has() */
        .chip-label:has(input:checked) {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
        }

        /* =========================================================
           File Upload Styling
           ========================================================= */
        input[type="file"] {
            padding: 0.6rem 0.8rem;
            background: var(--input-bg);
            border: 1.5px dashed var(--border-color);
            border-radius: var(--element-radius);
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-muted);
            transition: var(--transition);
            width: 100%;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        input[type="file"]::file-selector-button {
            padding: 0.5rem 1rem;
            margin-right: 0.85rem;
            background: var(--primary);
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--primary-hover);
        }

        /* =========================================================
           Terms & Conditions Container
           ========================================================= */
        .terms-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--element-radius);
            transition: var(--transition);
        }

        .terms-box:hover {
            background: #ffffff;
            border-color: var(--border-hover);
        }

        .terms-box:has(input:checked) {
            background: #f0fdf4;
            border-color: #22c55e;
        }

        .terms-box input[type="checkbox"] {
            accent-color: #16a34a;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }

        .terms-box label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }

        /* =========================================================
           Buttons & Actions
           ========================================================= */
        .form-actions {
            display: flex;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .btn-submit {
            flex: 2;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: var(--element-radius);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            flex: 1;
            padding: 0.85rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--secondary);
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--element-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-reset:hover {
            background: #ffffff;
            color: #ef4444;
            border-color: #fca5a5;
        }

        .btn-reset:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Form Header -->
        <header class="form-header">
            <div class="header-badge">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
                Admissions Portal
            </div>
            <h1>University Registration Form</h1>
            <p>Please fill out the form below to complete your student registration.</p>
        </header>

        <!-- Form Body -->
        <form>
            <!-- 1. Personal Details -->
            <section class="form-section">
                <div class="section-header">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <h2>Personal Details</h2>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="Firstname">First Name</label>
                        <input type="text" id="Firstname" name="Firstname" placeholder="e.g. John" required>
                    </div>
                    <div class="form-group">
                        <label for="Lastname">Last Name</label>
                        <input type="text" id="Lastname" name="Lastname" placeholder="e.g. Doe" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="dateofbirth">Date of Birth</label>
                        <input type="date" id="dateofbirth" name="dateofbirth" required>
                    </div>
                    <div class="form-group">
                        <span class="group-label">Gender</span>
                        <div class="options-row">
                            <label class="chip-label" for="male">
                                <input type="radio" id="male" name="gender" value="male">
                                Male
                            </label>
                            <label class="chip-label" for="female">
                                <input type="radio" id="female" name="gender" value="female">
                                Female
                            </label>
                            <label class="chip-label" for="other">
                                <input type="radio" id="other" name="gender" value="other">
                                Other
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="photo">Upload Your Photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </div>
            </section>

            <!-- 2. Contact Details -->
            <section class="form-section">
                <div class="section-header">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <h2>Contact Details</h2>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Street, City, State, ZIP code">
                </div>
            </section>

            <!-- 3. Academic Details -->
            <section class="form-section">
                <div class="section-header">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <h2>Academic Details</h2>
                </div>

                <div class="form-group">
                    <label for="course">Selected Course</label>
                    <div class="select-wrapper">
                        <select id="course" name="course">
                            <option value="btech">B.Tech (Bachelor of Technology)</option>
                            <option value="bca">B.CA (Bachelor of Computer Applications)</option>
                            <option value="bsc">B.S.C (Bachelor of Science)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <span class="group-label">Extracurricular Activities</span>
                    <div class="options-row">
                        <label class="chip-label" for="sports">
                            <input type="checkbox" id="sports" name="extracurricular" value="sports">
                            ⚽ Sports
                        </label>
                        <label class="chip-label" for="music">
                            <input type="checkbox" id="music" name="extracurricular" value="music">
                            🎵 Music
                        </label>
                        <label class="chip-label" for="arts">
                            <input type="checkbox" id="arts" name="extracurricular" value="arts">
                            🎨 Arts
                        </label>
                    </div>
                </div>
            </section>

            <!-- 4. Account Details -->
            <section class="form-section">
                <div class="section-header">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <h2>Create Your Account</h2>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="security-question">Security Question</label>
                        <div class="select-wrapper">
                            <select id="security-question" name="security question">
                                <option value="pet">What is your pet's name?</option>
                                <option value="school">What is the name of your first school?</option>
                                <option value="city">In which city were you born?</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="security-answer">Answer</label>
                        <input type="text" id="security-answer" name="security answer" placeholder="Your secret answer" required>
                    </div>
                </div>

                <div class="terms-box">
                    <input type="checkbox" id="terms" name="terms" value="terms" required>
                    <label for="terms">I agree to the university's terms and conditions</label>
                </div>
            </section>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    Submit Registration
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <button type="reset" class="btn-reset">Clear Form</button>
            </div>
        </form>
    </div>

</body>
</html>
