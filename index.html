<!-- headings tags <h><h/> are used to define headings in HTML. There are six levels of headings, from <h1> to <h6>, with <h1> being the highest level and <h6> being the lowest. Headings are important for structuring content and improving accessibility. -->
<h1>hello</h1><!-- <h1> is the highest priority -->
<h2>hello</h2>
<h3>hello</h3>
<h4>hello</h4>
<h5>hello</h5>
<h6>hello</h6><!-- <h6> is the lowest priority -->
