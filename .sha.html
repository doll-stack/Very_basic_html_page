<!-- headings tags <h><h/> are used to define headings in HTML. There are six levels of headings, from <h1> to <h6>, with <h1> being the highest level and <h6> being the lowest. Headings are important for structuring content and improving accessibility. -->
<h1>hello</h1><!-- <h1> is the highest priority -->
<h2>hello</h2>
<h3>hello</h3>
<h4>hello</h4>
<h5>hello</h5>
<h6>hello</h6><!-- <h6> is the lowest priority -->

<!-- Boilerplate code -->
 <!DOCTYPE html><!--new version of html5 -->
 <html lang="en"><!--opening tag of html-->
 <head> <!--content which is not visible but is important for the browser to understand the content of the page-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title> <!--title of the web page-->
 </head>
 <body>
      <!-- the content which you want to display -->
 </body>
 </html>

<!-- Form tag is used to create interactive forms -->
<form>
  <label for="name">Name:</label>
  <input type="text" id="name" name="name"><!--name="name" is used to identify the input field when the form is submitted -->
  <br>
  <br>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email"><!--name="email" is used to identify the email input field when the form is submitted -->
  <br>
  <br>
  <label for="gender">Gender:</label>
  <input type="radio" id="male" name="gender" value="male"><!--radio is ised for selecting one option -->
  <label for="male">Male</label>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>
  <br>
  <br>
  <label for="language">Languages:</label><!--checkbox is used for selecting multiple options -->
  <br>
  <label for="CPP">C++</label>
  <input type="checkbox" id="CPP" name="language" value="CPP">
  <br>
  <label for="Python">Python</label>
  <input type="checkbox" id="Python" name="language" value="Python">
  <br>
  <label for="Java">Java</label>
  <input type="checkbox" id="Java" name="language" value="Java">
  <br>
  <label for="JavaScript">JavaScript</label>
  <input type="checkbox" id="JavaScript" name="language" value="JavaScript">
  <br>
  <br>
  <input type="submit" value="Submit">
</form>
